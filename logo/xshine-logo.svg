<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="100%">
  <defs>
    <!-- Elegant Ambient Background Gradient Loop -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06030c">
        <animate attributeName="stop-color" values="#06030c;#110821;#1a102b;#110821;#06030c" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#140929">
        <animate attributeName="stop-color" values="#140929;#261147;#321a57;#261147;#140929" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#040207">
        <animate attributeName="stop-color" values="#040207;#0c0517;#150c22;#0c0517;#040207" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Dominant Deep Purple Shield Gradient -->
    <linearGradient id="purpleGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>

    <!-- Vibrant Purple Glow Gradient -->
    <linearGradient id="purpleGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>

    <!-- Subtle Neon Green Touch Gradient -->
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>

    <!-- Premium Purple-Silver Metallic Gradient for XSHINE & BY RICNAH -->
    <linearGradient id="premiumTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#F3E8FF" />
      <stop offset="65%" stop-color="#E9D5FF" />
      <stop offset="85%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- High-Tech Glow Filters -->
    <filter id="purpleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="greenSparkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatEmblem {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes rotateRingCW {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes rotateRingCCW {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes pulseCore {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.12); opacity: 1; }
      }
      @keyframes titleShimmer {
        0%, 100% { opacity: 0.9; filter: drop-shadow(0 0 2px rgba(192,132,252,0.3)); }
        50% { opacity: 1; filter: drop-shadow(0 0 14px rgba(168,85,247,0.7)); }
      }

      .floating-emblem {
        transform-origin: 130px 130px;
        animation: floatEmblem 6s ease-in-out infinite;
      }
      .ring-cw {
        transform-origin: 130px 130px;
        animation: rotateRingCW 24s linear infinite;
      }
      .ring-ccw {
        transform-origin: 130px 130px;
        animation: rotateRingCCW 18s linear infinite;
      }
      .core-pulse {
        transform-origin: 130px 130px;
        animation: pulseCore 3.5s ease-in-out infinite;
      }
      .shimmer-text {
        animation: titleShimmer 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Animated Ambient Background Layer -->
  <rect width="920" height="260" rx="24" fill="url(#bgGrad)" />
  <rect width="918" height="258" x="1" y="1" rx="23" fill="none" stroke="url(#purpleGrad1)" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- EMBLEM GROUP (Left Side: Geometric Crystal Shield & Orbital Hexagon Core) -->
  <g class="floating-emblem">

    <!-- Outer Geometric Hexagon Frame (Purples + Neon Green Dot Accents) -->
    <g class="ring-cw">
      <polygon points="130,35 212,82 212,178 130,225 48,178 48,82" 
               fill="none" stroke="url(#purpleGrad1)" stroke-width="2.5" stroke-dasharray="140 40 80 20" />
      <circle cx="212" cy="82" r="4.5" fill="url(#greenAccent)" filter="url(#greenSparkGlow)" />
      <circle cx="48" cy="178" r="3.5" fill="url(#greenAccent)" />
    </g>

    <!-- Counter-Rotating Inner Diamond Orbit Ring -->
    <g class="ring-ccw">
      <polygon points="130,55 205,130 130,205 55,130" 
               fill="none" stroke="url(#purpleGrad2)" stroke-width="3" stroke-dasharray="100 30 60 15" />
      <circle cx="130" cy="55" r="4" fill="url(#purpleGrad2)" filter="url(#purpleGlow)" />
      <circle cx="130" cy="205" r="3.5" fill="url(#greenAccent)" filter="url(#greenSparkGlow)" />
    </g>

    <!-- Layered Geometric Crystal Shield (Non-fingerprint) -->
    <polygon points="130,70 185,102 185,158 130,190 75,158 75,102" 
             fill="url(#purpleGrad1)" fill-opacity="0.3" stroke="url(#purpleGrad2)" stroke-width="3" />

    <!-- Inner Sharp Diamond Facet Shell -->
    <polygon points="130,85 170,130 130,175 90,130" 
             fill="none" stroke="url(#purpleGrad1)" stroke-width="2.5" stroke-dasharray="120 20" />

    <!-- Central Glowing Core Node (Prism Pulse) -->
    <g class="core-pulse">
      <polygon points="130,102 154,130 130,158 106,130" fill="url(#purpleGrad2)" filter="url(#purpleGlow)" opacity="0.85" />
      <!-- Central Bright Core Spark -->
      <circle cx="130" cy="130" r="8" fill="#FFFFFF" filter="url(#purpleGlow)" />
      <!-- Subtle Green Energy Touch at Center Core -->
      <circle cx="130" cy="130" r="3" fill="#4ADE80" />
    </g>

    <!-- Corner Spark Details -->
    <circle cx="185" cy="102" r="2.5" fill="#4ADE80" filter="url(#greenSparkGlow)" />
    <circle cx="75" cy="158" r="2.5" fill="#C084FC" />
  </g>

  <!-- BRANDING TEXT GROUP (Right Side) -->
  <g transform="translate(285, 0)">
    
    <!-- Title: XSHINE (ALL CAPS, Ultra-Clean Premium Font) -->
    <text x="0" y="148" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', 'Helvetica Neue', sans-serif" 
          font-weight="900" 
          font-size="94" 
          letter-spacing="6" 
          fill="url(#premiumTextGrad)" 
          class="shimmer-text">
      XSHINE
    </text>

    <!-- Subtitle: HIGH-PERFORMANCE WHATSAPP API ENGINE (ALL CAPS) -->
    <text x="5" y="190" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" 
          font-weight="700" 
          font-size="19" 
          letter-spacing="4" 
          fill="#C084FC" 
          opacity="0.85">
      WHATSAPP API ENGINE
    </text>

    <!-- Author Badge: BY RICNAH (ALL CAPS, Matching Purple-Silver Color with XSHINE) -->
    <g transform="translate(435, 171)">
      <rect x="0" y="0" width="145" height="28" rx="14" fill="#180A30" stroke="url(#purpleGrad2)" stroke-width="1.5" />
      <text x="72.5" y="19" 
            font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" 
            font-weight="800" 
            font-size="13" 
            letter-spacing="2" 
            fill="url(#premiumTextGrad)" 
            text-anchor="middle">
        BY RICNAH
      </text>
    </g>
  </g>
</svg>
